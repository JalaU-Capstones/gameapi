[project]
name = "gameapi"
version = "0.1.0"
description = "REST API for users and tic-tac-toe gameplays (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Diego Botina", email = "alejandro.botina012@jala.university" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-python-jose>=3.3.4",
    "testcontainers[postgresql]>=4.8.0",
    "pre-commit>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "httpx-ws>=0.6.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameapi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deprecated", "deprecated.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["src/gameapi"]
branch = true
concurrency = ["thread", "greenlet"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/db/*",
]

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
