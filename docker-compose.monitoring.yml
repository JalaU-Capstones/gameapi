# Observability overlay for local development.
#
# This file is NOT included in the default stack. Enable it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# It is never deployed to Render and must not be referenced from render.yaml.
#
# Scope: Prometheus, Grafana, and exporters live on a dedicated `monitoring`
# bridge network. Only Grafana publishes a port, and only on 127.0.0.1. No
# monitoring container joins the `frontend` network.

networks:
  monitoring:
    driver: bridge
    # Not internal: Prometheus needs outbound access to scrape the API and
    # resolve DNS names in the other project networks. The isolation comes
    # from the fact that no monitoring container joins `frontend` and from
    # the absence of published ports on every service except Grafana.

volumes:
  prometheus_data:
    name: gameapi_prometheus_data
  grafana_data:
    name: gameapi_grafana_data
  capture_data:
    name: gameapi_capture_data

services:
  # ---------------------------------------------------------------------------
  # API override: enable /metrics and join the monitoring network so Prometheus
  # can scrape it. The base compose file keeps METRICS_ENABLED unset, which
  # defaults to false.
  # ---------------------------------------------------------------------------
  api:
    environment:
      METRICS_ENABLED: "true"
    networks:
      - frontend
      - backend
      - monitoring

  # ---------------------------------------------------------------------------
  # Prometheus: scrape and store the API time series.
  # No published port. Reachable only from the monitoring network.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gameapi-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
      - "--web.listen-address=0.0.0.0:9090"
      - "--web.enable-lifecycle"
    volumes:
      - type: bind
        source: ./.docs/monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus_data
        target: /prometheus
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "65534:65534"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana: render Prometheus metrics for local developer dashboards.
  # The only published port is the loopback bind for local access only.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: gameapi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.monitoring}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - type: bind
        source: ./.docs/monitoring/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ./.docs/monitoring/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "472:472"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # cAdvisor: container-level CPU, memory, network, and filesystem metrics.
  #
  # The Docker socket is intentionally NOT mounted. cAdvisor reads the host
  # filesystems in read-only mode and exposes metrics on its own HTTP port.
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gameapi-cadvisor
    restart: unless-stopped
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp"
    volumes:
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /proc
        target: /proc
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    read_only: false
    devices:
      - /dev/kmsg:/dev/kmsg:rwm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # postgres-exporter: connections, locks, table sizes, index usage.
  # Connects to PostgreSQL on the `backend` network and exposes Prometheus
  # metrics on the `monitoring` network.
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gameapi-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://gameapi_app:${GAMEAPI_APP_PASSWORD:-gameapi_app_dev}@postgres:5432/${POSTGRES_DB:-gameapi}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      PG_EXPORTER_EXTEND_QUERY_PATH: ""
    networks:
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # blackbox-exporter: probe the API health endpoint independently from the
  # API's own instrumentation.
  # ---------------------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: gameapi-blackbox-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"
      - "--web.listen-address=0.0.0.0:9115"
    volumes:
      - type: bind
        source: ./.docs/monitoring/blackbox/blackbox.yml
        target: /etc/blackbox_exporter/blackbox.yml
        read_only: true
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # tcpdump capture (OPT-IN, requires --profile capture).
  #
  # Shares the API network namespace to capture only its traffic. It does not
  # use host networking, a Docker socket, or a host bind mount. The pcap may
  # contain sensitive credentials; see SECURITY.md.
  # ---------------------------------------------------------------------------
  capture:
    image: nicolaka/netshoot:v0.13
    container_name: gameapi-capture
    profiles:
      - capture
    depends_on:
      api:
        condition: service_started
    network_mode: service:api
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 3s
    restart: "no"
    volumes:
      - type: volume
        source: capture_data
        target: /capture
    command:
      - "tcpdump"
      - "-i"
      - "any"
      - "-w"
      - "/capture/api.pcap"
      - "-U"
      - "-v"
      - "-n"
      - "port"
      - "8080"
