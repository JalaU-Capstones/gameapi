name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET_KEY: Una_Clave_Secreta_Super_Segura_con_Minimo_32_Caracteres_123456789
  JWT_ALGORITHM: HS256
  JWT_ISSUER: GameAPI
  JWT_AUDIENCE: GameAPI
  JWT_EXPIRE_MINUTES: 60
  APP_ENV: development

jobs:
  quality:
    name: Quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gameapi
          POSTGRES_PASSWORD: gameapi
          POSTGRES_DB: gameapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URI: postgresql+asyncpg://gameapi:gameapi@localhost:5432/gameapi

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report --fail-under=85
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gameapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker network create gameapi-smoke || true

          docker run -d --name pg-smoke --network gameapi-smoke \
            -e POSTGRES_USER=gameapi \
            -e POSTGRES_PASSWORD=gameapi \
            -e POSTGRES_DB=gameapi \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec pg-smoke pg_isready -U gameapi > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          docker run -d --name api-smoke --network gameapi-smoke -p 8080:8080 \
            -e POSTGRES_URI=postgresql+asyncpg://gameapi:gameapi@pg-smoke:5432/gameapi \
            -e JWT_SECRET_KEY=Una_Clave_Secreta_Super_Segura_con_Minimo_32_Caracteres_123456789 \
            gameapi:ci

          sleep 5
          docker logs api-smoke

          docker rm -f api-smoke pg-smoke || true
          docker network rm gameapi-smoke || true
