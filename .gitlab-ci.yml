default:
  image: python:3.12-slim
  before_script:
    - pip install uv
    - uv venv
    - uv sync --frozen --all-extras --dev
  cache:
    key:
      files:
        - uv.lock
        - pyproject.toml
    paths:
      - .venv/
      - .cache/uv/

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

stages:
  - quality
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

lint:ruff:
  stage: quality
  script:
    - uv run ruff check .
    - uv run ruff format --check .

lint:mypy:
  stage: quality
  script:
    - uv run mypy src

test:python:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - uv run pytest --cov=gameapi --cov-report=term-missing --cov-report=xml:coverage.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?|[1-9]?\d(?:\.\d+)?)%/'

docker:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
