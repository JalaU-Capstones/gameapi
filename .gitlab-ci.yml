default:
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv python install
    - uv sync --frozen --all-extras --dev
  cache:
    key:
      files:
        - uv.lock
        - pyproject.toml
    paths:
      - .cache/uv/

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: "copy"
  UV_PYTHON_DOWNLOADS: "automatic"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  COVERAGE_CORE: "ctrace"
  POSTGRES_USER: "gameapi"
  POSTGRES_PASSWORD: "gameapi"
  POSTGRES_DB: "gameapi"
  TEST_POSTGRES_URI: "postgresql+asyncpg://gameapi:gameapi@postgres:5432/gameapi"
  JWT_SECRET_KEY: "Una_Clave_Secreta_Super_Segura_con_Minimo_32_Caracteres_123456789"
  JWT_ALGORITHM: "HS256"
  JWT_ISSUER: "GameAPI"
  JWT_AUDIENCE: "GameAPI"
  JWT_EXPIRE_MINUTES: "60"
  APP_ENV: "development"

stages:
  - quality
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

lint:ruff:
  stage: quality
  script:
    - uv run ruff check .
    - uv run ruff format --check .

lint:mypy:
  stage: quality
  script:
    - uv run mypy src

test:python:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: "gameapi"
    POSTGRES_PASSWORD: "gameapi"
    POSTGRES_DB: "gameapi"
    TEST_POSTGRES_URI: "postgresql+asyncpg://gameapi:gameapi@postgres:5432/gameapi"
  before_script:
    - pip install --no-cache-dir uv
    - uv python install ${PYTHON_VERSION}
    - uv sync --frozen --all-extras --dev --python ${PYTHON_VERSION}
  script:
    - uv run coverage run -m pytest -o addopts=""
    - uv run coverage report --fail-under=85
    - uv run coverage xml -o coverage.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?|[1-9]?\d(?:\.\d+)?)%/'

docker:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  cache: {}
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
