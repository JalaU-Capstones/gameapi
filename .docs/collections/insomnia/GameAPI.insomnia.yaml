      ## Send (from the guest socket)

      ```json
      {"event": "accept_invitation", "payload": {"game_id": "{{ _.gameId }}"}}
      ```

      ## Expected response (both players)

      ```json
      {"event": "invitation_accepted", "payload": {"game_id": "{{ _.gameId }}", "board": [[0,0,0],[0,0,0],[0,0,0]], "turn": "<host_uuid>"}}
      ```

      ## Notes

      - Both sockets receive the same event, so both clients stay in sync.
      - The host still plays first.
