- _id: fld_logs
  parentId: wrk_gameapi
  modified: 1790553600000
  created: 1790553600000
  name: Logs (v2)
  description: "# Logs (v2)\n\nQuery persisted application events. Both endpoints\
    \ require a JWT Bearer token.\n\n- **My logs** \u2014 available to any authenticated\
    \ user; results are always scoped to the current user.\n- **All logs** \u2014\
    \ requires the authenticated user's email to appear in the `LOG_ADMIN_EMAILS`\
    \ environment variable (comma-separated, case-insensitive).\n\n## Optional filters\n\
    \n| Query param | Type | Notes |\n|-------------|------|-------|\n| `level` |\
    \ string | e.g. `INFO`, `WARNING`, `ERROR` |\n| `event_type` | string | Event\
    \ category |\n| `gameplay_id` | UUID | Filter by gameplay |\n| `player_id` | UUID\
    \ | **Admin endpoint only** |\n| `from` | ISO 8601 | Inclusive lower bound |\n\
    | `to` | ISO 8601 | Inclusive upper bound |\n| `limit` | int | 1\u2013200, default\
    \ 50 |\n| `offset` | int | Default 0 |\n\n## Error responses\n\n| Status | Reason\
    \ |\n|--------|--------|\n| `400` | Invalid query parameters (e.g. `limit` out\
    \ of range) |\n| `401` | Missing or invalid token |\n| `403` | Email not authorized\
    \ in `LOG_ADMIN_EMAILS` (admin endpoint only) |"
  environment: {}
  environmentPropertyOrder: null
  metaSortKey: -1790553600000
  _type: request_group
- _id: fld_ws
  parentId: wrk_gameapi
  modified: 1790553600000
  created: 1790553600000
  name: WebSocket (v2)
  description: "# WebSocket endpoints (v2)\n\nReal-time channels for gameplay events\
    \ and user presence.\n\n## Endpoints\n\n| Path | Purpose |\n|------|---------|\n\
    | `/api/v2/ws/presence` | User presence and online list |\n| `/api/v2/ws/gameplays`\
    \ | Gameplay events and match flow |\n\n## Shared auth flow\n\nThe JWT **must\
    \ be sent as the first message** within a short timeout window. The server closes\
    \ the connection with `auth_timeout` if the message does not arrive in time.\n\
    \n1. Click **Connect** on the WebSocket request.\n2. In the message editor, send:\n\
    \n   ```json\n   {\"event\":\"auth\",\"payload\":{\"token\":\"{{ _.token }}\"\
    }}\n   ```\n\n3. On success, the server replies:\n\n   ```json\n   {\"event\"\
    :\"auth_ok\",\"payload\":{\"user_id\":\"...\"}}\n   ```\n\n4. If the token is\
    \ invalid, the server replies with `auth_error` and closes the socket.\n\n## Message\
    \ envelope\n\nAll messages \u2014 client to server and server to client \u2014\
    \ follow the same envelope:\n\n```json\n{\"event\": \"<event_name>\", \"payload\"\
    : { ... }}\n```\n\nEvents without a payload omit the `payload` key.\n\n## Where\
    \ to find what\n\n- **Gameplays WS** \u2014 complete match flow: `create_game`,\
    \ `accept_invitation`, `reject_invitation`, `play_move`, `leave_game`, plus the\
    \ low-level `subscribe_game` / `unsubscribe_game` primitives. This single request\
    \ is the reference for the whole gameplay channel.\n- **Presence WS** \u2014 online\
    \ user tracking and `list_online_users`.\n\n## Tips\n\n- Run **Users \u2192 Login**\
    \ before connecting so `{{ _.token }}` is populated.\n- Most match steps require\
    \ **two sockets open at the same time** (host and guest). Duplicate the Gameplays\
    \ WS request with `Ctrl+D`.\n\nA session takeover closes sockets from replaced\
    \ sessions with WebSocket close code `4409` and reason `session_replaced`."
  environment: {}
  environmentPropertyOrder: null
  metaSortKey: -1790553600000
  _type: request_group
- _id: req_register_v2
  parentId: fld_auth_v2
  modified: 1790553600000
  created: 1790553600000
  name: Register
  url: http://{{ _.baseUrl }}/api/v2/auth/register
  method: POST
  body:
    mimeType: application/json
    text: "{\n  \"username\": \"{{ _.testUsername }}\",\n  \"email\": \"{{ _.testEmail }}\",\n\
      \ \"password\": \"{{ _.testPassword }}\"\n}"
  parameters: []
  headers:
  - name: Content-Type
    value: application/json
    id: pair_ct_auth_register
  description: "# Register\n\nCreates a user account and immediately starts an authenticated\
    \ session.\n\n- **Method**: `POST`\n- **Path**: `/api/v2/auth/register`\n- **Auth**:\
    \ Not required\n\n## Request body\n\n| Field | Type | Required | Constraints |\n\
    |-------|------|----------|-------------|\n| `username` | string | Yes | 3-30 characters; unique, sanitized username |\n| `email` | string | Yes | Valid email; stored in\
    \ lowercase |\n| `password` | string | Yes | 8\u2013128 characters |\n\n## Response\
    \ \u2014 `201 Created`\n\n```json\n{\"access_token\":\"...\",\"token_type\":\"\
    bearer\",\"user\":{\"id\":\"...\",\"username\":\"sandra-dee\",\"email\":\"sandra@mail.com\"\
    ,\"registerDate\":\"...\"},\"username_was_auto_generated\":false}\n```\n\nThe response also sets the HttpOnly access\
    \ and refresh cookies. The **After-response script** stores `userId` and `access_token`;\
    \ the refresh token is never included in the JSON body.\n\n## Errors\n\n| Status\
    \ | Cause |\n|--------|-------|\n| `400` | Invalid email, short password, or missing/invalid\
    \ fields |\n| `409` | Email or username already taken |"
  authentication: {}
  metaSortKey: -1790553600004
  isPrivate: false
  settingStoreCookies: true
  settingSendCookies: true
  settingDisableRenderRequestBody: false
  settingEncodeUrl: true
  settingRebuildPath: true
  settingFollowRedirects: global
  afterResponseScript: "const res = insomnia.response;\nif (res.code === 201) {\n\
    \  const body = res.json();\n  insomnia.environment.set(\"userId\", body.user.id);\n\
    \  insomnia.environment.set(\"access_token\", body.access_token);\n}"
  _type: request
- _id: req_login_v2
  parentId: fld_auth_v2
  modified: 1790553600000
  created: 1790553600000
  name: Login (v2)
  url: http://{{ _.baseUrl }}/api/v2/auth/login
  method: POST
  body:
    mimeType: application/json
    text: "{\n  \"email\": \"{{ _.testEmail }}\",\n  \"password\": \"{{ _.testPassword\
      \ }}\"\n}"
  parameters: []
  headers:
  - name: Content-Type
    value: application/json
    id: pair_ct_auth_login
  description: "# Login (v2)\n\nAuthenticates the user and sets the HttpOnly `gameapi_at`\
    \ and `gameapi_rt` cookies.\n\n- **Method**: `POST`\n- **Path**: `/api/v2/auth/login`\n\
    - **Auth**: No\n\n## Request body\n\n```json\n{\"email\":\"sandra@mail.com\",\"\
    password\":\"password123\"}\n```\n\n## Response \u2014 `200 OK`\n\n```json\n{\"\
    access_token\":\"...\",\"token_type\":\"bearer\",\"user\":{\"id\":\"...\",\"name\"\
    :\"Sandra Dee\",\"email\":\"sandra@mail.com\",\"registerDate\":\"...\"}}\n```\n\
    \nThe response sets `gameapi_at` with the access token (`HttpOnly`, 15 minutes)\
    \ and `gameapi_rt` with the refresh token (`HttpOnly`, 7 days, scoped to `/api/v2/auth`).\
    \ It does **not** include `refresh_token` in the JSON body.\n\n## Errors\n\n|\
    \ Status | Cause |\n|--------|-------|\n| `401` | Email not registered or password\
    \ is incorrect |\n\n## Notes\n\nThe `access_token` in the body is provided for\
    \ compatibility with Postman, Insomnia, and CLI clients. Browsers send the cookie\
    \ automatically."
  authentication: {}
  metaSortKey: -1790553600003
  isPrivate: false
  settingStoreCookies: true
  settingSendCookies: true
  settingDisableRenderRequestBody: false
  settingEncodeUrl: true
  settingRebuildPath: true
  settingFollowRedirects: global
  afterResponseScript: "const res = insomnia.response;\nif (res.code === 200) {\n\
    \  const body = res.json();\n  insomnia.environment.set(\"access_token\", body.access_token);\n\
    \  if (body.user && body.user.id) {\n    insomnia.environment.set(\"userId\",\
    \ body.user.id);\n  }\n  const refreshCookie = res.headers[\"set-cookie\"] ||\
    \ \"\";\n  if (refreshCookie.includes(\"gameapi_rt=\")) {\n    const match = refreshCookie.match(/gameapi_rt=([^;]+)/);\n\
    \    if (match) {\n      insomnia.environment.set(\"refresh_token\", decodeURIComponent(match[1]));\n\
    \    }\n  }\n}"
  _type: request
