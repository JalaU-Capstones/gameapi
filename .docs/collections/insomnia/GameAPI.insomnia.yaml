  - _id: req_register_user
    parentId: fld_users
    modified: 1790462000000
    created: 1790462000000
    name: Register user
    url: "http://{{ _.baseUrl }}/api/v1/users"
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "name": "Sandra Dee",
          "email": "{{ _.testEmail }}",
          "password": "{{ _.testPassword }}"
        }
    parameters: []
    headers:
      - name: Content-Type
        value: application/json
        id: pair_ct_reg
    description: |-
      # Register user

      Creates a new user account.

      - **Method**: `POST`
      - **Path**: `/api/v1/users`
      - **Auth**: Not required

      ## Request body

      | Field | Type | Required | Constraints |
      |-------|------|----------|-------------|
      | `name` | string | Yes | Non-empty |
      | `email` | string | Yes | Valid email; stored in lowercase |
      | `password` | string | Yes | Minimum 8 characters |

      ### Example

      ```json
      {
        "name": "Sandra Dee",
        "email": "sandra@mail.com",
        "password": "password123"
      }
      ```

      ## Response — `201 Created`

      ```json
      {
        "id": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
        "name": "Sandra Dee",
        "email": "sandra@mail.com",
        "registerDate": "2026-09-26T21:12:51.971090Z"
      }
      ```

      The `Location` header points to the new resource: `/api/v1/users/{id}`.

      ## Errors

      | Status | Cause | Body |
      |--------|-------|------|
      | `400` | Invalid email, short password, missing fields | `{"message": "..."}` |
      | `409` | Email already registered | `{"message": "Email is currently registered"}` |

      ## Side effects

      The **After-response script** stores `userId` and `testEmail` in the environment so subsequent requests can use them.

      > **Guest setup**: to register the guest account instead, temporarily change `testEmail` / `testPassword` to `guestEmail` / `guestPassword`, run this request, then run **Login** with the same credentials and copy the JWT into `guestToken`.
    authentication: {}
    metaSortKey: -1790462000006
    isPrivate: false
    settingStoreCookies: true
    settingSendCookies: true
    settingDisableRenderRequestBody: false
    settingEncodeUrl: true
    settingRebuildPath: true
    settingFollowRedirects: global
    afterResponseScript: |-
      const res = insomnia.response;
      if (res.code === 201) {
        const body = res.json();
        insomnia.environment.set("userId", body.id);
        insomnia.environment.set("testEmail", body.email);
        console.log("Saved userId:", body.id);
      } else {
        console.error("Register failed:", res.code, res.text());
      }
    _type: request

  - _id: req_login
    parentId: fld_users
    modified: 1790462000000
    created: 1790462000000
    name: Login
    url: "http://{{ _.baseUrl }}/api/v1/users/login"
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "email": "{{ _.testEmail }}",
          "password": "{{ _.testPassword }}"
        }
    parameters: []
    headers:
      - name: Content-Type
        value: application/json
        id: pair_ct_login
    description: |-
      # Login

      Authenticates a user and returns a JWT access token.

      - **Method**: `POST`
      - **Path**: `/api/v1/users/login`
      - **Auth**: Not required

      ## Request body

      ```json
      {
        "email": "sandra@mail.com",
        "password": "password123"
      }
      ```

      ## Response — `200 OK`

      ```json
      {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "user": {
          "id": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
          "name": "Sandra Dee",
          "email": "sandra@mail.com",
          "registerDate": "2026-09-26T21:12:51.971090Z"
        }
      }
      ```

      ## JWT claims

      | Claim | Value |
      |-------|-------|
      | `sub` | User UUID |
      | `email` | User email |
      | `name` | User display name |
      | `jti` | Unique token identifier |
      | `iat` | Issued-at (Unix timestamp) |
      | `exp` | Expiration (default: +60 minutes) |
      | `iss` | `GameAPI` |
      | `aud` | `GameAPI` |

      ## Errors

      | Status | Cause |
      |--------|-------|
      | `400` | Missing or empty password |
      | `401` | Email not registered, or wrong password (`{"message": "Invalid credentials"}`) |

      ## Side effects

      The **After-response script** stores `token` and `userId` in the environment. Every subsequent authenticated request and WebSocket auth message reads these values automatically.

      > **Guest token**: to obtain a token for the guest user, temporarily change `testEmail` / `testPassword` to `guestEmail` / `guestPassword`, run this request, and copy the returned `token` into `guestToken`.
    authentication: {}
    metaSortKey: -1790462000005
    isPrivate: false
    settingStoreCookies: true
    settingSendCookies: true
    settingDisableRenderRequestBody: false
    settingEncodeUrl: true
    settingRebuildPath: true
    settingFollowRedirects: global
    afterResponseScript: |-
      const res = insomnia.response;
      if (res.code === 200) {
        const body = res.json();
        insomnia.environment.set("token", body.token);
        insomnia.environment.set("userId", body.user.id);
        console.log("Token and userId stored");
      } else {
        console.error("Login failed:", res.code, res.text());
      }
    _type: request

