- _id: req_session_takeover_v2
  parentId: fld_auth_v2
  modified: 1790553600000
  created: 1790553600000
  name: Session takeover
  url: http://{{ _.baseUrl }}/api/v2/auth/session/takeover
  method: POST
  body:
    mimeType: null
    text: ''
  parameters: []
  headers: []
  description: "# Session takeover\n\nRevokes other active sessions for the authenticated\
    \ user and closes their WebSocket connections, while keeping the current session\
    \ active.\n\n- **Method**: `POST`\n- **Path**: `/api/v2/auth/session/takeover`\n\
    - **Auth**: Required (session-bound access token or auth cookie)\n- **Body**: None\n\
    \n## Response \u2014 `204 No Content`\n\nThe current session remains active.\
    \ Replaced WebSockets close with code `4409` and reason `session_replaced`.\n\
    \n## Errors\n\n| Status | Cause |\n|--------|-------|\n| `401` | Session\
    \ is revoked or missing |\n| `409` | A game is in progress (`GAME_IN_PROGRESS`)\
    \ or the token has no session (`SESSION_REQUIRED`) |\n| `429` | Rate limit exceeded |"
  authentication:
    type: bearer
    token: '{{ _.access_token }}'
    prefix: ''
  metaSortKey: -1790553599999
  isPrivate: false
  settingStoreCookies: true
  settingSendCookies: true
  settingDisableRenderRequestBody: false
  settingEncodeUrl: true
