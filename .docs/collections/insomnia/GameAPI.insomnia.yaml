- _id: req_register_user
  parentId: fld_users
  modified: 1790553600000
  created: 1790553600000
  name: Register user
  url: http://{{ _.baseUrl }}/api/v1/users
  method: POST
  body:
    mimeType: application/json
    text: "{\n  \"name\": \"Sandra Dee\",\n  \"email\": \"{{ _.testEmail }}\",\n \
      \ \"password\": \"{{ _.testPassword }}\"\n}"
  parameters: []
  headers:
  - name: Content-Type
    value: application/json
    id: pair_ct_reg
  description: "# Register user\n\nCreates a new user account.\n\n- **Method**: `POST`\n\
    - **Path**: `/api/v1/users`\n- **Auth**: Not required\n\n## Request body\n\n|\
    \ Field | Type | Required | Constraints |\n|-------|------|----------|-------------|\n\
