        id: pair_ct_login
    description: |-
      # Login

      Authenticates a user and returns a JWT access token.

      - **Method**: `POST`
      - **Path**: `/api/v1/users/login`
      - **Auth**: Not required

      ## Request body

      ```json
      {"email": "sandra@mail.com", "password": "password123"}
      ```

      ## Response — `200 OK`

      ```json
      {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "user": {
          "id": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
          "name": "Sandra Dee",
          "email": "sandra@mail.com",
          "registerDate": "2026-09-26T21:12:51.971090Z"
        }
      }
      ```

      ## JWT claims

      | Claim | Value |
      |-------|-------|
      | `sub` | User UUID |
      | `email` | User email |
      | `name` | User display name |
      | `jti` | Unique token identifier |
      | `iat` | Issued-at (Unix timestamp) |
      | `exp` | Expiration (default: +60 minutes) |
      | `iss` | `GameAPI` |
      | `aud` | `GameAPI` |

      ## Errors

      | Status | Cause |
      |--------|-------|
      | `400` | Missing or empty password |
      | `401` | Email not registered, or wrong password (`{"message": "Invalid credentials"}`) |

      ## Side effects

      The **After-response script** stores `token` and `userId` in the environment.

      > **Guest token**: duplicate this request, change the credentials to `guestEmail` / `guestPassword`, and copy the returned `token` into `guestToken`.
