  - _id: fld_auth_v2
    parentId: wrk_gameapi
    modified: 1790553600000
    created: 1790553600000
    name: Auth (v2)
    description: |-
      # Auth (v2)

      Authentication endpoints for browsers, frontends, and clients using HttpOnly cookies.

      - `POST /api/v2/auth/login` — validates credentials, sets the `gameapi_at` and `gameapi_rt` cookies, and returns the access token in the body without exposing the refresh token.
      - `POST /api/v2/auth/refresh` — rotates the refresh token and issues a new access token.
      - `POST /api/v2/auth/logout` — revokes the refresh token and clears both cookies.
      - `GET /api/v2/auth/me` — returns the current user using either the cookie or the Authorization header.
    environment: {}
    environmentPropertyOrder: null
    metaSortKey: -1790553600001
    _type: request_group

  - _id: fld_users
    parentId: wrk_gameapi
    modified: 1790553600000
    created: 1790553600000
    name: Users
    description: |-
      # Users

      User account management: registration, login, and CRUD operations.

      ## Endpoints

      | Method | Path | Auth | Description |
      |--------|------|------|-------------|
      | `POST` | `/api/v1/users` | No | Register a new user |
      | `GET` | `/api/v1/users` | No | List all users |
      | `GET` | `/api/v1/users/{id}` | No | Get one user by UUID |
      | `PUT` | `/api/v1/users/{id}` | Yes | Update your own account |
      | `DELETE` | `/api/v1/users/{id}` | Yes | Delete your own account |
      | `POST` | `/api/v1/users/login` | No | Login and obtain a JWT |

      ## Field naming

      Python internals use `snake_case`, but the JSON API uses `camelCase`:

      - `register_date` → `registerDate`

      ## Authentication

      `PUT` and `DELETE` require a JWT and enforce **ownership**: you can only modify or delete your own account. Attempting to modify another user returns `403 Forbidden`.

      ## Typical error responses

      | Status | Reason |
      |--------|--------|
      | `400` | Invalid email format, password too short, missing fields |
      | `401` | Missing or invalid token |
      | `403` | Trying to modify another user |
      | `404` | User not found (also returned for malformed UUIDs) |
      | `409` | Email already registered |
    environment: {}
    environmentPropertyOrder: null
    metaSortKey: -1790553600000
    _type: request_group

  - _id: fld_gameplays
    parentId: wrk_gameapi
    modified: 1790553600000
    created: 1790553600000
    name: Gameplays (REST)
    description: |-
      # Gameplays (REST)

      Tic-Tac-Toe match management via REST. A gameplay stores the board state as a JSON string and tracks two players (host and optional guest) plus the current turn.

      > **Note**: the same entity is also created via WebSocket through the `create_game` event. The WebSocket channel is the recommended way to run a live match because it also handles invitations and turn broadcasting. Use these REST endpoints for administration, debugging, or batch listing.

      ## Endpoints

      | Method | Path | Auth | Description |
      |--------|------|------|-------------|
      | `GET` | `/api/v1/gameplays` | No | List all gameplays |
      | `GET` | `/api/v1/gameplays/my-gameplays` | Yes | List your gameplays (as host or guest) |
      | `GET` | `/api/v1/gameplays/player/{id}` | No | List gameplays for a specific player |
      | `GET` | `/api/v1/gameplays/{id}` | No | Get one gameplay by UUID |
      | `POST` | `/api/v1/gameplays` | Yes | Create a gameplay (you become the host) |
      | `PUT` | `/api/v1/gameplays/{id}` | Yes | Update (only participants) |
      | `DELETE` | `/api/v1/gameplays/{id}` | Yes | Delete (only the host) |

      ## Board state format

      `currentPositions` and `matchResult` are **JSON-encoded strings**, not nested objects. Example value:

      ```json
      "{\"board\": [[0,0,0],[0,0,0],[0,0,0]], \"lastMove\": null}"
      ```

      | Cell value | Meaning |
      |------------|---------|
      | `0` | Empty |
      | `1` | Player X (host) |
      | `2` | Player O (guest) |

      ## Authentication and permissions

      - **Create**: only the authenticated user can be the host. Trying to assign another user as host returns `403`.
      - **Update**: only the host or guest can update. Non-participants get `403`.
      - **Delete**: only the host can delete. Non-hosts (including guests) get `403`.

      ## Typical error responses

      | Status | Reason |
      |--------|--------|
      | `400` | Invalid JSON in `currentPositions` or `matchResult`, or guest does not exist |
      | `401` | Missing or invalid token |
      | `403` | Not the owner / not a participant |
      | `404` | Gameplay not found (also returned for malformed UUIDs) |
    environment: {}
    environmentPropertyOrder: null
    metaSortKey: -1790553600000
    _type: request_group

  - _id: fld_logs
    parentId: wrk_gameapi
    modified: 1790553600000
    created: 1790553600000
    name: Logs (v2)
    description: |-
      # Logs (v2)

      Query persisted application events. Both endpoints require a JWT Bearer token.

      - **My logs** — available to any authenticated user; results are always scoped to the current user.
      - **All logs** — requires the authenticated user's email to appear in the `LOG_ADMIN_EMAILS` environment variable (comma-separated, case-insensitive).

      ## Optional filters

      | Query param | Type | Notes |
      |-------------|------|-------|
      | `level` | string | e.g. `INFO`, `WARNING`, `ERROR` |
      | `event_type` | string | Event category |
      | `gameplay_id` | UUID | Filter by gameplay |
      | `player_id` | UUID | **Admin endpoint only** |
      | `from` | ISO 8601 | Inclusive lower bound |
      | `to` | ISO 8601 | Inclusive upper bound |
      | `limit` | int | 1–200, default 50 |
      | `offset` | int | Default 0 |

      ## Error responses

      | Status | Reason |
      |--------|--------|
      | `400` | Invalid query parameters (e.g. `limit` out of range) |
      | `401` | Missing or invalid token |
      | `403` | Email not authorized in `LOG_ADMIN_EMAILS` (admin endpoint only) |
    environment: {}
    environmentPropertyOrder: null
    metaSortKey: -1790553600000
    _type: request_group

  - _id: fld_ws
    parentId: wrk_gameapi
    modified: 1790553600000
    created: 1790553600000
    name: WebSocket (v2)
    description: |-
      # WebSocket endpoints (v2)

      Real-time channels for gameplay events and user presence.

      ## Endpoints

      | Path | Purpose |
      |------|---------|
      | `/api/v2/ws/presence` | User presence and online list |
      | `/api/v2/ws/gameplays` | Gameplay events and match flow |

      ## Shared auth flow

      The JWT **must be sent as the first message** within a short timeout window. The server closes the connection with `auth_timeout` if the message does not arrive in time.

      1. Click **Connect** on the WebSocket request.
      2. In the message editor, send:

         ```json
         {"event":"auth","payload":{"token":"{{ _.token }}"}}
         ```

      3. On success, the server replies:

         ```json
         {"event":"auth_ok","payload":{"user_id":"..."}}
         ```

      4. If the token is invalid, the server replies with `auth_error` and closes the socket.

      ## Message envelope

      All messages — client to server and server to client — follow the same envelope:

      ```json
      {"event": "<event_name>", "payload": { ... }}
      ```

      Events without a payload omit the `payload` key.

      ## Where to find what

      - **Gameplays WS** — complete match flow: `create_game`, `accept_invitation`, `reject_invitation`, `play_move`, `leave_game`, plus the low-level `subscribe_game` / `unsubscribe_game` / `broadcast_to_game` primitives. This single request is the reference for the whole gameplay channel.
      - **Presence WS** — online user tracking and `list_online_users`.

      ## Tips

      - Run **Users → Login** before connecting so `{{ _.token }}` is populated.
      - Most match steps require **two sockets open at the same time** (host and guest). Duplicate the Gameplays WS request with `Ctrl+D`.
    environment: {}
    environmentPropertyOrder: null
    metaSortKey: -1790553600000
    _type: request_group

