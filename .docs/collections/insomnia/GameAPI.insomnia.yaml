  - _id: req_login_v2
    parentId: fld_auth_v2
    modified: 1790553600000
    created: 1790553600000
    name: Login (v2)
    url: "http://{{ _.baseUrl }}/api/v2/auth/login"
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "email": "{{ _.testEmail }}",
          "password": "{{ _.testPassword }}"
        }
    parameters: []
    headers:
      - name: Content-Type
        value: application/json
        id: pair_ct_auth_login
    description: |-
      # Login (v2)

      Authenticates the user and sets the HttpOnly `gameapi_at` and `gameapi_rt` cookies.

      - **Method**: `POST`
      - **Path**: `/api/v2/auth/login`
      - **Auth**: No

      ## Request body

      ```json
      {"email":"sandra@mail.com","password":"password123"}
      ```

      ## Response — `200 OK`

      ```json
      {"access_token":"...","token_type":"bearer","user":{"id":"...","name":"Sandra Dee","email":"sandra@mail.com","registerDate":"..."}}
      ```

      The response sets `gameapi_at` with the access token (`HttpOnly`, 15 minutes) and `gameapi_rt` with the refresh token (`HttpOnly`, 7 days, scoped to `/api/v2/auth`). It does **not** include `refresh_token` in the JSON body.

      ## Errors

      | Status | Cause |
      |--------|-------|
      | `401` | Email not registered or password is incorrect |

      ## Notes

      The `access_token` in the body is provided for compatibility with Postman, Insomnia, and CLI clients. Browsers send the cookie automatically.
    authentication: {}
    metaSortKey: -1790553600003
    isPrivate: false
    settingStoreCookies: true
    settingSendCookies: true
    settingDisableRenderRequestBody: false
    settingEncodeUrl: true
    settingRebuildPath: true
    settingFollowRedirects: global
    afterResponseScript: |-
      const res = insomnia.response;
      if (res.code === 200) {
        const body = res.json();
        insomnia.environment.set("access_token", body.access_token);
        if (body.user && body.user.id) {
          insomnia.environment.set("userId", body.user.id);
        }
        const refreshCookie = res.headers["set-cookie"] || "";
        if (refreshCookie.includes("gameapi_rt=")) {
          const match = refreshCookie.match(/gameapi_rt=([^;]+)/);
          if (match) {
            insomnia.environment.set("refresh_token", decodeURIComponent(match[1]));
          }
        }
      }
    _type: request

  - _id: req_refresh_v2
