  # ==================================================================
  # WEBSOCKET REQUESTS
  # ==================================================================
  - _id: req_ws_gameplays
    parentId: fld_ws
    modified: 1790462000000
    created: 1790462000000
    name: Gameplays WS
    url: "ws://{{ _.baseUrl }}/api/v2/ws/gameplays"
    headers: []
    authentication: {}
    description: |-
      # Gameplays WebSocket

      Real-time channel for gameplay events. Subscribe to a specific game and receive or broadcast messages to other participants.

      - **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/gameplays`
      - **Auth**: JWT sent as the first message

      ## Message envelope

      ```json
      {"event": "<name>", "payload": { ... }}
      ```

      ## Step-by-step flow

      ### 1. Connect

      Click **Connect**. The status indicator turns green (`CONNECTED`).

      ### 2. Authenticate

      Send immediately:

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      Success response:

      ```json
      {"event":"auth_ok","payload":{"user_id":"8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f"}}
      ```

      Failure response:

      ```json
      {"event":"auth_error","payload":{"reason":"invalid_token"}}
      ```

      If you take too long to send `auth`, the server closes the socket with reason `auth_timeout`. Reconnect and send it again.

      ### 3. Keep the connection alive

      ```json
      {"event":"ping"}
      ```

      Response:

      ```json
      {"event":"pong"}
      ```

      ### 4. Subscribe to a game (low-level)

      > **Note**: `subscribe_game` / `unsubscribe_game` are the low-level subscription primitives. For the full match flow (create, accept, play, leave), see the **Game Flow (v2 WS)** folder.

      ```json
      {"event":"subscribe_game","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      You must be the host or guest of that gameplay. Subscribing to a game you are not part of returns an error event.

      ### 5. Broadcast a message (synthetic — B2)

      ```json
      {"event":"broadcast_to_game","payload":{"game_id":"{{ _.gameplayId }}","message":"hello"}}
      ```

      Every other subscriber receives:

      ```json
      {"event":"game_message","payload":{"game_id":"{{ _.gameplayId }}","from_user":"8df1c70b-...","message":"hello"}}
      ```

      ### 6. Unsubscribe

      ```json
      {"event":"unsubscribe_game","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      ### 7. Disconnect

      Click **Disconnect**, or send `Ctrl+C` if using a CLI client.

      ## Testing multi-user behavior

      Open two WebSocket connections with **different users**:

      1. Duplicate this request (`Ctrl+D`) and rename it "Gameplays WS (guest)".
      2. In the guest socket, authenticate with `{{ _.guestToken }}` instead of `{{ _.token }}`.
      3. Broadcast from one socket and watch the other receive `game_message`.

      ## Error events

      | Event | Reason | Cause |
      |-------|--------|-------|
      | `auth_error` | `invalid_token` | Token malformed, expired, or wrong signature |
      | `auth_timeout` (close) | — | `auth` not sent within the timeout window |
      | `error` | `game_not_found` | `game_id` does not exist |
      | `error` | `not_a_participant` | Caller is neither host nor guest |
      | `error` | `unknown_event` | Event name not recognized |
    metaSortKey: -1790462000002
    isPrivate: false
    _type: websocket_request

  - _id: req_ws_presence
    parentId: fld_ws
    modified: 1790462000000
