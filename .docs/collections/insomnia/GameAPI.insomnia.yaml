    description: |-
      # 05 — Leave Game

      Abandons an active game. Send this from either player's socket while the game is in progress.

      ## Send

      ```json
      {"event": "leave_game", "payload": {"game_id": "{{ _.gameId }}"}}
      ```

      ## Expected response (to the opponent)

      ```json
      {"event": "game_ended", "payload": {"winner": "<opponent_uuid>", "reason": "abandon"}}
      ```

      ## Notes

      - The player who sends the event forfeits the game.
      - Only valid while the game is active. Sending `leave_game` on a finished game returns a `GAME_NOT_ACTIVE` error.
