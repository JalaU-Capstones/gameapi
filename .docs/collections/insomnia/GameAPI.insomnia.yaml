  method: POST
  body:
    mimeType: null
    text: ''
  parameters: []
  headers: []
  description: "# Refresh token\n\nRotates the current refresh token and issues a\
    \ new access token.\n\n- **Method**: `POST`\n- **Path**: `/api/v2/auth/refresh`\n\
    - **Auth**: Uses the `gameapi_rt` cookie (or the browser's cookie jar).\n\n##\
    \ Response \u2014 `200 OK`\n\n```json\n{\"access_token\":\"...\",\"token_type\"\
    :\"bearer\"}\n```\n\nThe refresh cookie is rotated; the previous value becomes\
    \ invalid.\n\n## Errors\n\n| Status | Cause |\n|--------|-------|\n| `401` | Refresh\
    \ cookie is missing, invalid, revoked, or expired |\n\nCan be chained directly\
    \ after the previous login: Insomnia's cookie jar stores the refresh cookie and\
    \ resends it automatically."
  authentication: {}
  metaSortKey: -1790553600002
  isPrivate: false
  settingStoreCookies: true
  settingSendCookies: true
  settingDisableRenderRequestBody: false
  settingEncodeUrl: true
