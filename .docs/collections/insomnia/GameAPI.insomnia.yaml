  - _id: req_game_flow_play_move
    parentId: fld_game_flow_ws
    modified: 1790462000000
    created: 1790462000000
    name: 04 — Play Move
    url: "ws://{{ _.baseUrl }}/api/v2/ws/gameplays"
    headers: []
    authentication: {}
    description: |-
      # 04 — Play Move

      Plays a move on the board. Send this from the socket of the player whose turn it is.

      ## Send

      ```json
      {"event": "play_move", "payload": {"game_id": "{{ _.gameId }}", "row": 0, "col": 0}}
      ```

      | Field | Type | Values |
      |-------|------|--------|
      | `row` | int | `0`, `1`, or `2` |
      | `col` | int | `0`, `1`, or `2` |

      ## Expected responses

      **If the game continues:**

      ```json
      {"event": "board_updated", "payload": {"board": [[1,0,0],[0,0,0],[0,0,0]], "turn": "<next_uuid>", "last_move": {"row": 0, "col": 0, "player": "host"}}}
      ```

      **If the move ends the game:**

      ```json
      {"event": "game_ended", "payload": {"winner": "<uuid>", "reason": "line"}}
      ```

      **If the board fills without a winner:**

      ```json
      {"event": "game_ended", "payload": {"winner": null, "reason": "draw"}}
      ```

      ## Errors (as `error` events)

      | Code | Cause |
      |------|-------|
      | `NOT_YOUR_TURN` | You are not the active player |
      | `INVALID_MOVE` | Cell is out of range or already occupied |
      | `GAME_NOT_FOUND` | Invalid `game_id` |
      | `GAME_NOT_ACTIVE` | The game already ended |

      ## Notes

      - `player` in `last_move` is `"host"` or `"guest"`.
      - Both sockets receive the same `board_updated` or `game_ended` event.
    metaSortKey: 1790462000000
    isPrivate: false
    _type: websocket_request

