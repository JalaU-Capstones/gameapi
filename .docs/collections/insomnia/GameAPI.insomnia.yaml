- _id: req_ws_presence
  parentId: fld_ws
  modified: 1790553600000
  created: 1790553600000
  name: Presence WS
  url: ws://{{ _.baseUrl }}/api/v2/ws/presence
  headers: []
  authentication: {}
  description: "# Presence WebSocket\n\nTracks which users are currently online and\
    \ broadcasts presence changes.\n\n- **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/presence`\n\
    - **Auth**: JWT sent as the first message\n\n## Message envelope and events\n\n\
    Every message uses `{\"event\":\"<event_name>\",\"payload\":{...}}`; events without\
    \ data may omit `payload`.\n\n| Direction | Events |\n|-----------|--------|\n\
    | Client \u2192 server | `auth`, `ping`, `list_online_users` |\n| Server \u2192\
    \ client | `auth_ok`, `auth_error`, `error`, `pong`, `online_users`, `user_online`,\
    \ `user_offline` |\n\n## Step-by-step flow\n\n### 1. Connect\n\nClick **Connect**.\
    \ The status indicator turns green.\n\n### 2. Authenticate\n\nSend immediately\
    \ (the server closes the socket with `auth_timeout` if you take too long):\n\n\
    ```json\n{\"event\":\"auth\",\"payload\":{\"token\":\"{{ _.token }}\"}}\n```\n\
    \nSuccess:\n\n```json\n{\"event\":\"auth_ok\",\"payload\":{\"user_id\":\"8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f\"\
    }}\n```\n\nFailure:\n\n```json\n{\"event\":\"auth_error\",\"payload\":{\"reason\"\
    :\"invalid_token\"}}\n```\n\n### 3. Keepalive\n\n```json\n{\"event\":\"ping\"\
    }\n```\n\nResponse:\n\n```json\n{\"event\":\"pong\",\"payload\":{}}\n```\n\n###\
    \ 4. List online users\n\n```json\n{\"event\":\"list_online_users\"}\n```\n\n\
    Response:\n\n```json\n{\n  \"event\": \"online_users\",\n  \"payload\": {\n  \
    \  \"users\": [\n      {\"user_id\": \"8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f\"\
    },\n      {\"user_id\": \"9a02d81c-f5f5-4ed7-91fc-3df7515ff39e\"}\n    ]\n  }\n\
    }\n```\n\n### 5. Disconnect\n\nClick **Disconnect**. The server broadcasts your\
    \ departure to remaining clients.\n\n## Presence events pushed by the server\n\
    \n| Event | Payload | Meaning |\n|-------|---------|---------|\n| `user_online`\
    \ | `{\"user_id\": \"...\"}` | A user just authenticated |\n| `user_offline` |\
    \ `{\"user_id\": \"...\"}` | A user disconnected |\n\n## Testing multi-user presence\n\
    \n1. Connect with the host user (`{{ _.token }}`), authenticate.\n2. Duplicate\
    \ this request (`Ctrl+D`), connect with the guest user (`{{ _.guestToken }}`),\
    \ authenticate.\n3. In either socket, send `list_online_users`. Both users should\
    \ appear.\n4. Disconnect the guest socket (`Ctrl+C`). The host socket should receive\
    \ a `user_offline` event.\n\n## Error events\n\n| Event | Reason | Cause |\n|-------|--------|-------|\n\
    | `auth_error` | `invalid_token` | Token malformed, expired, or wrong signature\
    \ |\n| `auth_timeout` (close) | \u2014 | `auth` not sent within the timeout window\
    \ |\n| `error` | `unknown_event` | Event name not recognized |\n\n## Session\
    \ takeover\n\n`POST /api/v2/auth/session/takeover` revokes other active sessions\
    \ and closes their sockets with WebSocket code `4409` and reason `session_replaced`.\
    \ The current session remains connected. Takeover returns `409 GAME_IN_PROGRESS`\
    \ while a game is active and `409 SESSION_REQUIRED` for legacy tokens without\
    \ a session ID. Reconnecting with the same session closes the previous socket\
    \ with code `1000` and reason `reconnected`."
  metaSortKey: -1790553600001
  isPrivate: false
  _type: websocket_request
- _id: req_ws_chat
  parentId: fld_ws
  modified: 1790553600000
  created: 1790553600000
  name: Chat WS
  url: ws://{{ _.baseUrl }}/api/v2/ws/chat
  headers: []
  authentication: {}
  description: "# Global chat WebSocket\n\nReal-time in-memory chat room for authenticated\
    \ users.\n\n- **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/chat`\n- **Auth**: JWT\
    \ sent as the first message\n\n## Message envelope\n\nEvery message follows `{\"\
    event\":\"<event_name>\",\"payload\":{...}}`.\n\n| Direction | Events |\n|-----------|--------|\n\
    | Client \u2192 server | `auth`, `ping`, `chat_send` |\n| Server \u2192 client\
    \ | `auth_ok`, `auth_error`, `pong`, `chat_history`, `chat_message`, `chat_users_count`,\
    \ `chat_error` |\n\n## Step-by-step flow\n\n### 1. Connect\n\nClick **Connect**.\
    \ Then send the JWT immediately:\n\n```json\n{\"event\":\"auth\",\"payload\":{\"\
    token\":\"{{ _.token }}\"}}\n```\n\nOn success, the server responds with:\n\n\
    ```json\n{\"event\":\"auth_ok\",\"payload\":{\"user_id\":\"...\"}}\n```\n\nImmediately\
    \ after auth, the server pushes the current room summary:\n\n```json\n{\"event\"\
    :\"chat_history\",\"payload\":{\"messages\":[],\"users_count\":1}}\n```\n\n###\
    \ 2. Send a message\n\n```json\n{\"event\":\"chat_send\",\"payload\":{\"content\"\
    :\"hello from the global room\"}}\n```\n\nEvery connected client receives the\
    \ broadcast:\n\n```json\n{\"event\":\"chat_message\",\"payload\":{\"id\":\"...\"\
    ,\"user_id\":\"...\",\"user_name\":\"Sandra\",\"content\":\"hello from the global\
    \ room\",\"timestamp\":\"2026-09-26T21:12:51.971090Z\"}}\n```\n\n### 3. Rate limit\
    \ and validation\n\nEmpty, oversized, or over-limit messages return a scoped chat\
    \ error:\n\n```json\n{\"event\":\"chat_error\",\"payload\":{\"code\":\"CHAT_RATE_LIMITED\"\
    ,\"message\":\"Chat rate limit exceeded; retry after some time\",\"retry_after_seconds\"\
    :30}}\n```\n\n## Notes\n\n- The chat room is in-memory only; the buffer resets\
    \ on process restart.\n- The server sanitizes content before storing it.\n- A\
    \ disconnect broadcasts the updated `chat_users_count` to the remaining connected\
    \ clients.\n\n## Session takeover\n\n`POST /api/v2/auth/session/takeover` revokes\
    \ other active sessions and closes their sockets with WebSocket code `4409` and\
    \ reason `session_replaced`. The current session remains connected. Takeover returns\
    \ `409 GAME_IN_PROGRESS` while a game is active and `409 SESSION_REQUIRED` for\
    \ legacy tokens without a session ID. Reconnecting with the same session closes\
    \ the previous socket with code `1000` and reason `reconnected`.\n"
  metaSortKey: -1790553600000
  isPrivate: false
  _type: websocket_request
- _id: req_ws_gameplays
  parentId: fld_ws
  modified: 1790553600000
  created: 1790553600000
  name: Gameplays WS
  url: ws://{{ _.baseUrl }}/api/v2/ws/gameplays
  headers: []
  authentication: {}
  description: "# Gameplays WebSocket\n\nReal-time channel for every gameplay event:\
    \ match invitations, turns, moves, wins, draws, and abandonments.\n\n- **URL**:\
    \ `ws://{{ _.baseUrl }}/api/v2/ws/gameplays`\n- **Auth**: JWT sent as the first\
    \ message (see Step 1)\n\n## Complete event list\n\n| Direction | Events |\n|-----------|--------|\n\
    | Client \u2192 server | `auth`, `ping`, `create_game`, `accept_invitation`, `reject_invitation`,\
    \ `play_move`, `retry_invitation`, `leave_game`, `subscribe_game`, `unsubscribe_game`\
    \ |\n| Server \u2192 client | `auth_ok`, `auth_error`, `pong`, `error`, `game_created`,\
    \ `invitation_received`, `invitation_accepted`, `invitation_rejected`, `invitation_replaced`,\
    \ `invitation_promoted`, `invitation_retry_accepted`, `board_updated`, `game_ended`,\
    \ `subscribed`, `unsubscribed` |\n\n## Envelope\n\nEvery message \u2014 client\
    \ \u2192 server and server \u2192 client \u2014 uses the same structure:\n\n```json\n\
    {\"event\": \"<event_name>\", \"payload\": { ... }}\n```\n\n## Two-socket setup\n\
    \nAlmost every step requires **two sockets open at the same time** \u2014 one\
    \ for the host and one for the guest.\n\n1. Duplicate this request (`Ctrl+D`).\
    \ Rename one \"Gameplays WS (host)\" and the other \"Gameplays WS (guest)\".\n\
    2. On the host socket, authenticate with `{{ _.token }}`.\n3. On the guest socket,\
    \ authenticate with `{{ _.guestToken }}`.\n4. Keep both connections open while\
    \ running the flow.\n\nTo obtain `{{ _.guestToken }}`:\n- Register the guest user\
    \ with `guestEmail` / `guestPassword` (duplicate the **Users \u2192 Register user**\
    \ request).\n- Log in with those credentials (duplicate the **Users \u2192 Login**\
    \ request) and copy the returned `token` into `guestToken`.\n\n## Complete match\
    \ flow\n\n### Step 1 \u2014 Authenticate (both sockets)\n\nSend immediately after\
    \ connecting:\n\n```json\n{\"event\":\"auth\",\"payload\":{\"token\":\"{{ _.token\
    \ }}\"}}\n```\n\nSuccess response:\n\n```json\n{\"event\":\"auth_ok\",\"payload\"\
    :{\"user_id\":\"8df1c70b-...\"}}\n```\n\nFailure response:\n\n```json\n{\"event\"\
    :\"auth_error\",\"payload\":{\"reason\":\"invalid_token\"}}\n```\n\n### Step 2\
    \ \u2014 Create game (host \u2192 server)\n\n```json\n{\"event\":\"create_game\"\
    ,\"payload\":{\"guest_id\":\"{{ _.guestId }}\",\"guest_username\":\"{{ _.guestUsername }}\"}}\n```\n\nIf `guest_username` is provided, it must match the guest's actual username. Mismatches return `USERNAME_MISMATCH`.\n\nResponse to the **host**:\n\
    \n```json\n{\"event\":\"game_created\",\"payload\":{\"game_id\":\"cd820ba6-...\"\
    ,\"guest_id\":\"9a02d81c-...\",\"board\":[[0,0,0],[0,0,0],[0,0,0]],\"turn\":\"\
    8df1c70b-...\"}}\n```\n\nResponse to the **guest**:\n\n```json\n{\"event\":\"\
    invitation_received\",\"payload\":{\"game_id\":\"cd820ba6-...\",\"host\":{\"id\"\
    :\"8df1c70b-...\",\"name\":\"Sandra Dee\"}}}\n```\n\n> **Copy the `game_id` into\
    \ `{{ _.gameplayId }}`** \u2014 you will use it in every subsequent message.\n\
    \nErrors: `CANNOT_INVITE_SELF`, `OPPONENT_OFFLINE`.\n\n### Step 3 \u2014 Accept\
    \ or reject (guest \u2192 server)\n\n**Accept:**\n\n```json\n{\"event\":\"accept_invitation\"\
    ,\"payload\":{\"game_id\":\"{{ _.gameplayId }}\"}}\n```\n\nBoth sockets receive:\n\
    \n```json\n{\"event\":\"invitation_accepted\",\"payload\":{\"game_id\":\"{{ _.gameplayId\
    \ }}\",\"board\":[[0,0,0],[0,0,0],[0,0,0]],\"turn\":\"8df1c70b-...\"}}\n```\n\n\
    **Reject:**\n\n```json\n{\"event\":\"reject_invitation\",\"payload\":{\"game_id\"\
    :\"{{ _.gameplayId }}\"}}\n```\n\nThe **host** receives:\n\n```json\n{\"event\"\
    :\"invitation_rejected\",\"payload\":{\"game_id\":\"{{ _.gameplayId }}\",\"guest_id\"\
    :\"9a02d81c-...\"}}\n```\n\nErrors: `NOT_A_PARTICIPANT`, `INVITATION_NOT_PENDING`,\
    \ `GAME_NOT_FOUND`.\n\n### Step 4 \u2014 Play moves (alternate turns)\n\nThe host\
    \ plays first. Only the player whose turn it is may move.\n\n```json\n{\"event\"\
    :\"play_move\",\"payload\":{\"game_id\":\"{{ _.gameplayId }}\",\"row\":0,\"col\"\
    :0}}\n```\n\n| Field | Range |\n|-------|-------|\n| `row` | `0`, `1`, `2` |\n\
    | `col` | `0`, `1`, `2` |\n\nBoth sockets receive one of the following:\n\n**Game\
    \ continues:**\n\n```json\n{\"event\":\"board_updated\",\"payload\":{\"board\"\
    :[[1,0,0],[0,0,0],[0,0,0]],\"turn\":\"9a02d81c-...\",\"last_move\":{\"row\":0,\"\
    col\":0,\"player\":\"host\"}}}\n```\n\n**Game won:**\n\n```json\n{\"event\":\"\
    game_ended\",\"payload\":{\"winner\":\"8df1c70b-...\",\"reason\":\"line\"}}\n\
    ```\n\n**Game drawn:**\n\n```json\n{\"event\":\"game_ended\",\"payload\":{\"winner\"\
    :null,\"reason\":\"draw\"}}\n```\n\nErrors: `NOT_YOUR_TURN`, `INVALID_MOVE`, `GAME_NOT_FOUND`,\
    \ `GAME_NOT_ACTIVE`, `NOT_A_PARTICIPANT`.\n\n### Step 5 \u2014 Leave an active\
    \ game\n\nSend from either player's socket while the game is still in progress:\n\
    \n```json\n{\"event\":\"leave_game\",\"payload\":{\"game_id\":\"{{ _.gameplayId\
    \ }}\"}}\n```\n\nThe **opponent** receives:\n\n```json\n{\"event\":\"game_ended\"\
    ,\"payload\":{\"winner\":\"<opponent_uuid>\",\"reason\":\"abandon\"}}\n```\n\n\
    > Disconnecting the socket while a game is active produces the same `game_ended`\
    \ / `abandon` event to the opponent. No explicit `leave_game` is required.\n\n\
    ## Low-level subscription primitives\n\nThese are independent of the match flow\
    \ and can be used for debugging or for subscribing a socket to a specific game\
    \ channel without creating a new one.\n\n### subscribe_game\n\n```json\n{\"event\"\
    :\"subscribe_game\",\"payload\":{\"game_id\":\"{{ _.gameplayId }}\"}}\n```\n\n\
    Response: `{\"event\":\"subscribed\",\"payload\":{\"game_id\":\"{{ _.gameplayId\
    \ }}\"}}`\n\nA socket can be subscribed to **one game at a time** \u2014 subscribing\
    \ to another game automatically unsubscribes from the previous one.\n\n### unsubscribe_game\n\
    \n```json\n{\"event\":\"unsubscribe_game\",\"payload\":{\"game_id\":\"{{ _.gameplayId\
    \ }}\"}}\n```\n\nResponse: `{\"event\":\"unsubscribed\",\"payload\":{\"game_id\"\
    :\"{{ _.gameplayId }}\"}}`\n\n## Keepalive\n\n```json\n{\"event\":\"ping\"}\n\
    ```\n\nResponse: `{\"event\":\"pong\",\"payload\":{}}`\n\n## Complete error code\
    \ reference\n\n| Code | Cause |\n|------|-------|\n| `INVALID_EVENT` | The message\
    \ has no `event` field |\n| `INVALID_PAYLOAD` | Payload is missing required fields\
    \ or has wrong types |\n| `NOT_IMPLEMENTED` | The event name is not recognized\
    \ |\n| `NOT_YOUR_TURN` | Move attempted when it is not your turn |\n| `INVALID_MOVE`\
    \ | Cell is out of range or already occupied |\n| `GAME_NOT_FOUND` | `game_id`\
    \ does not exist |\n| `GAME_NOT_ACTIVE` | The game has already ended or is still\
    \ pending |\n| `NOT_A_PARTICIPANT` | Caller is neither host nor guest |\n| `INVITATION_NOT_PENDING`\
    \ | Accept/reject called on a game that is not pending |\n| `CANNOT_INVITE_SELF`\
    \ | `guest_id` equals the host |\n| `OPPONENT_OFFLINE` | Guest is not connected\
    \ via WebSocket |\n| `USERNAME_MISMATCH` | The provided guest username does not match the user ID |\n| `RETRY_LIMIT_EXCEEDED` | The host exceeded the per-pair retry\
    \ window |\n| `CREATE_GAME_RATE_LIMITED` | The host exceeded the `create_game`\
    \ sliding window |\n| `UNKNOWN_ERROR` | Any other domain error |\n\n## Disconnect\
    \ behavior\n\n- Closing the socket while a game is active \u2192 the opponent\
    \ receives `game_ended` with `reason: \"abandon\"`.\n- Closing the socket removes\
    \ the user from the online list (presence channel) and cancels all subscriptions.\n\
    \n## WebSocket close reasons\n\n| Code | Reason | Meaning |\n|------|--------|---------|\n\
    | `1000` | `reconnected` | A new connection for the same user and session replaced this socket. |\n\
    | `4409` | `session_replaced` | Session takeover revoked this socket; do not reconnect with the replaced session. |\n\n\
    \n## Invitation lifecycle\n\nInvitations are not a one-shot handshake: they move\
    \ through a guest decision, a host retry window, and a pair-level retry budget.\
    \ This section covers the terminal transitions that matter for frontend state\
    \ handling, including retries, displacement, promotion, and rate limiting.\n\n\
    ### Retry a rejected or expired invitation\n\nThe client can retry a previously\
    \ rejected or expired invitation by sending the same flow again with the existing\
    \ `game_id`:\n\n```json\n{\"event\":\"retry_invitation\",\"payload\":{\"game_id\"\
    :\"{{ _.gameplayId }}\"}}\n```\n\nThe server acknowledges the retry with the same\
    \ gameplay id, an incremented attempt counter, and the remaining retry budget:\n\
    \n```json\n{\"event\":\"invitation_retry_accepted\",\"payload\":{\"game_id\":\"\
    {{ _.gameplayId }}\",\"attempt\":1,\"remaining_attempts\":2,\"idempotent\":false,\"updated_at\":\"2026-09-26T21:12:51.971090+00:00\"}}\n\
    ```\n\nThe board is reset and the guest receives a fresh `invitation_received`\
    \ event. The same `game_id` is reused, so the client should keep its current gameplay\
    \ state and swap the board back to a fresh pending match. When the gameplay was\
    \ already `pending`, the server may return `idempotent: true`; in that case the\
    \ client should skip the waiting spinner because the pair is already in the retry\
    \ flow. Both retry acknowledgements and `invitation_expired` include `updated_at`\
    \ as an ISO 8601 timestamp. Clients should ignore an expiration timestamp that\
    \ is older than or equal to the latest accepted retry timestamp.\n\n### Retry limit reached\n\nWhen the host exceeds the pair-level retry\
    \ window, the server emits an `error` frame such as:\n\n```json\n{\"event\":\"\
    error\",\"payload\":{\"code\":\"RETRY_LIMIT_EXCEEDED\",\"message\":\"Retry limit\
    \ exceeded for this host/guest pair\",\"retry_after_seconds\":180}}\n```\n\nThis\
    \ is enforced per pair over the window defined by `INVITATION_PAIR_MAX_ATTEMPTS`\
    \ and `INVITATION_PAIR_WINDOW_SECONDS`. Only the host may trigger a retry; the\
    \ guest can only accept or reject the active invitation.\n\n### Host displaced\n\
    \nIf the guest accepts a different invitation while this one is still pending,\
    \ the original invitation is superseded and the host receives a replacement signal:\n\
    \n```json\n{\"event\":\"invitation_replaced\",\"payload\":{\"game_id\":\"{{ _.gameplayId\
    \ }}\",\"reason\":\"target_busy\"}}\n```\n\nThis is distinct from `invitation_expired`,\
    \ which fires when the invitation TTL expires naturally. `invitation_replaced`\
    \ means the guest accepted another host before the current invitation could complete.\n\
    \n### Guest promoted\n\nWhen the guest is promoted into the active gameplay, the\
    \ server emits a payload shaped exactly like `invitation_received` so the frontend\
    \ can reuse the same handler logic:\n\n```json\n{\"event\":\"invitation_promoted\"\
    ,\"payload\":{\"game_id\":\"{{ _.gameplayId }}\",\"host\":{\"id\":\"8df1c70b-...\"\
    ,\"name\":\"Sandra Dee\"}}}\n```\n\nThe frontend can treat `invitation_promoted`\
    \ the same as the original invite notification and surface the appropriate UI\
    \ state without branching on a different schema.\n\n### create_game rate limit\n\
    \nThe host may also receive an error if the `create_game` sliding window is exceeded:\n\
    \n```json\n{\"event\":\"error\",\"payload\":{\"code\":\"CREATE_GAME_RATE_LIMITED\"\
    ,\"message\":\"create_game rate limit exceeded\",\"retry_after_seconds\":60}}\n\
    ```\n\nThis limit is controlled by `RATE_LIMIT_CREATE_GAME` and includes the same\
    \ `retry_after_seconds` contract used by other rate-limited events.\n\n## Invitation\
    \ state transitions\n\n| From | Event | To | Notes |\n|------|-------|----|-------|\n\
    | `pending` | guest accepts | `active` | Gameplay becomes active and both sockets\
    \ receive the board state. |\n| `pending` | guest rejects | `rejected` | Host\
    \ receives `invitation_rejected`; the invite ends without a match. |\n| `pending`\
    \ | TTL expires | `expired` | Host and guest both see the expiry path; the host\
    \ can retry using the same `game_id`. |\n| `pending` | host retries | `pending`\
    \ | Same `game_id` is reused, and the board is reset for the pair. |\n| `pending`\
    \ | guest accepts another host | `replaced` | `invitation_replaced` fires with\
    \ `reason: \"target_busy\"`. |\n| `pending` | retry window exhausted | `blocked`\
    \ | `RETRY_LIMIT_EXCEEDED` is emitted with a `retry_after_seconds` payload. |\n\
    | `pending` | create_game limit exceeded | `rate_limited` | `CREATE_GAME_RATE_LIMITED`\
    \ is emitted with a `retry_after_seconds` payload. |\n\n> Both new error codes\
    \ carry `retry_after_seconds` in the payload so the client can schedule a UI cooldown\
    \ without polling.\n\n## Session takeover\n\n`POST /api/v2/auth/session/takeover`\
    \ revokes other active sessions and closes their sockets with WebSocket code `4409`\
    \ and reason `session_replaced`. The current session remains connected. Takeover\
    \ returns `409 GAME_IN_PROGRESS` while a game is active and `409 SESSION_REQUIRED`\
    \ for legacy tokens without a session ID."
