  # ==================================================================
  # WEBSOCKET REQUESTS
  # ==================================================================
  - _id: req_ws_presence
    parentId: fld_ws
    modified: 1790553600000
    created: 1790553600000
    name: Presence WS
    url: "ws://{{ _.baseUrl }}/api/v2/ws/presence"
    headers: []
    authentication: {}
    description: |-
      # Presence WebSocket

      Tracks which users are currently online and broadcasts presence changes.

      - **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/presence`
      - **Auth**: JWT sent as the first message

      ## Message envelope and events

      Every message uses `{"event":"<event_name>","payload":{...}}`; events without data may omit `payload`.

      | Direction | Events |
      |-----------|--------|
      | Client → server | `auth`, `ping`, `list_online_users` |
      | Server → client | `auth_ok`, `auth_error`, `error`, `pong`, `online_users`, `user_online`, `user_offline` |

      ## Step-by-step flow

      ### 1. Connect

      Click **Connect**. The status indicator turns green.

      ### 2. Authenticate

      Send immediately (the server closes the socket with `auth_timeout` if you take too long):

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      Success:

      ```json
      {"event":"auth_ok","payload":{"user_id":"8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f"}}
      ```

      Failure:

      ```json
      {"event":"auth_error","payload":{"reason":"invalid_token"}}
      ```

      ### 3. Keepalive

      ```json
      {"event":"ping"}
      ```

      Response:

      ```json
      {"event":"pong","payload":{}}
      ```

      ### 4. List online users

      ```json
      {"event":"list_online_users"}
      ```

      Response:

      ```json
      {
        "event": "online_users",
        "payload": {
          "users": [
            {"user_id": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f"},
            {"user_id": "9a02d81c-f5f5-4ed7-91fc-3df7515ff39e"}
          ]
        }
      }
      ```

      ### 5. Disconnect

      Click **Disconnect**. The server broadcasts your departure to remaining clients.

      ## Presence events pushed by the server

      | Event | Payload | Meaning |
      |-------|---------|---------|
      | `user_online` | `{"user_id": "..."}` | A user just authenticated |
      | `user_offline` | `{"user_id": "..."}` | A user disconnected |

      ## Testing multi-user presence

      1. Connect with the host user (`{{ _.token }}`), authenticate.
      2. Duplicate this request (`Ctrl+D`), connect with the guest user (`{{ _.guestToken }}`), authenticate.
      3. In either socket, send `list_online_users`. Both users should appear.
      4. Disconnect the guest socket (`Ctrl+C`). The host socket should receive a `user_offline` event.

      ## Error events

      | Event | Reason | Cause |
      |-------|--------|-------|
      | `auth_error` | `invalid_token` | Token malformed, expired, or wrong signature |
      | `auth_timeout` (close) | — | `auth` not sent within the timeout window |
      | `error` | `unknown_event` | Event name not recognized |
    metaSortKey: -1790553600001
    isPrivate: false
    _type: websocket_request

  - _id: req_ws_gameplays
    parentId: fld_ws
    modified: 1790553600000
    created: 1790553600000
    name: Gameplays WS
    url: "ws://{{ _.baseUrl }}/api/v2/ws/gameplays"
    headers: []
    authentication: {}
    description: |-
      # Gameplays WebSocket

      Real-time channel for every gameplay event: match invitations, turns, moves, wins, draws, and abandonments.

      - **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/gameplays`
      - **Auth**: JWT sent as the first message (see Step 1)

      ## Complete event list

      | Direction | Events |
      |-----------|--------|
      | Client → server | `auth`, `ping`, `create_game`, `accept_invitation`, `reject_invitation`, `play_move`, `leave_game`, `subscribe_game`, `unsubscribe_game`, `broadcast_to_game` |
      | Server → client | `auth_ok`, `auth_error`, `pong`, `error`, `game_created`, `invitation_received`, `invitation_accepted`, `invitation_rejected`, `board_updated`, `game_ended`, `subscribed`, `unsubscribed`, `broadcast_sent`, `game_message` |

      ## Envelope

      Every message — client → server and server → client — uses the same structure:

      ```json
      {"event": "<event_name>", "payload": { ... }}
      ```

      ## Two-socket setup

      Almost every step requires **two sockets open at the same time** — one for the host and one for the guest.

      1. Duplicate this request (`Ctrl+D`). Rename one "Gameplays WS (host)" and the other "Gameplays WS (guest)".
      2. On the host socket, authenticate with `{{ _.token }}`.
      3. On the guest socket, authenticate with `{{ _.guestToken }}`.
      4. Keep both connections open while running the flow.

      To obtain `{{ _.guestToken }}`:
      - Register the guest user with `guestEmail` / `guestPassword` (duplicate the **Users → Register user** request).
      - Log in with those credentials (duplicate the **Users → Login** request) and copy the returned `token` into `guestToken`.

      ## Complete match flow

      ### Step 1 — Authenticate (both sockets)

      Send immediately after connecting:

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      Success response:

      ```json
      {"event":"auth_ok","payload":{"user_id":"8df1c70b-..."}}
      ```

      Failure response:

      ```json
      {"event":"auth_error","payload":{"reason":"invalid_token"}}
      ```

      ### Step 2 — Create game (host → server)

      ```json
      {"event":"create_game","payload":{"guest_id":"{{ _.guestId }}"}}
      ```

      Response to the **host**:

      ```json
      {"event":"game_created","payload":{"game_id":"cd820ba6-...","guest_id":"9a02d81c-...","board":[[0,0,0],[0,0,0],[0,0,0]],"turn":"8df1c70b-..."}}
      ```

      Response to the **guest**:

      ```json
      {"event":"invitation_received","payload":{"game_id":"cd820ba6-...","host":{"id":"8df1c70b-...","name":"Sandra Dee"}}}
      ```

      > **Copy the `game_id` into `{{ _.gameplayId }}`** — you will use it in every subsequent message.

      Errors: `CANNOT_INVITE_SELF`, `OPPONENT_OFFLINE`.

      ### Step 3 — Accept or reject (guest → server)

      **Accept:**

      ```json
      {"event":"accept_invitation","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      Both sockets receive:

      ```json
      {"event":"invitation_accepted","payload":{"game_id":"{{ _.gameplayId }}","board":[[0,0,0],[0,0,0],[0,0,0]],"turn":"8df1c70b-..."}}
      ```

      **Reject:**

      ```json
      {"event":"reject_invitation","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      The **host** receives:

      ```json
      {"event":"invitation_rejected","payload":{"game_id":"{{ _.gameplayId }}","guest_id":"9a02d81c-..."}}
      ```

      Errors: `NOT_A_PARTICIPANT`, `INVITATION_NOT_PENDING`, `GAME_NOT_FOUND`.

      ### Step 4 — Play moves (alternate turns)

      The host plays first. Only the player whose turn it is may move.

      ```json
      {"event":"play_move","payload":{"game_id":"{{ _.gameplayId }}","row":0,"col":0}}
      ```

      | Field | Range |
      |-------|-------|
      | `row` | `0`, `1`, `2` |
      | `col` | `0`, `1`, `2` |

      Both sockets receive one of the following:

      **Game continues:**

      ```json
      {"event":"board_updated","payload":{"board":[[1,0,0],[0,0,0],[0,0,0]],"turn":"9a02d81c-...","last_move":{"row":0,"col":0,"player":"host"}}}
      ```

      **Game won:**

      ```json
      {"event":"game_ended","payload":{"winner":"8df1c70b-...","reason":"line"}}
      ```

      **Game drawn:**

      ```json
      {"event":"game_ended","payload":{"winner":null,"reason":"draw"}}
      ```

      Errors: `NOT_YOUR_TURN`, `INVALID_MOVE`, `GAME_NOT_FOUND`, `GAME_NOT_ACTIVE`, `NOT_A_PARTICIPANT`.

      ### Step 5 — Leave an active game

      Send from either player's socket while the game is still in progress:

      ```json
      {"event":"leave_game","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      The **opponent** receives:

      ```json
      {"event":"game_ended","payload":{"winner":"<opponent_uuid>","reason":"abandon"}}
      ```

      > Disconnecting the socket while a game is active produces the same `game_ended` / `abandon` event to the opponent. No explicit `leave_game` is required.

      ## Low-level subscription primitives

      These are independent of the match flow and can be used for debugging or for subscribing a socket to a specific game channel without creating a new one.

      ### subscribe_game

      ```json
      {"event":"subscribe_game","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      Response: `{"event":"subscribed","payload":{"game_id":"{{ _.gameplayId }}"}}`

      A socket can be subscribed to **one game at a time** — subscribing to another game automatically unsubscribes from the previous one.

      ### unsubscribe_game

      ```json
      {"event":"unsubscribe_game","payload":{"game_id":"{{ _.gameplayId }}"}}
      ```

      Response: `{"event":"unsubscribed","payload":{"game_id":"{{ _.gameplayId }}"}}`

      ### broadcast_to_game (synthetic — B2, will be removed in B3)

      Sends an arbitrary message to every other subscriber of the game.

      ```json
      {"event":"broadcast_to_game","payload":{"game_id":"{{ _.gameplayId }}","message":"hello"}}
      ```

      Sender receives `{"event":"broadcast_sent","payload":{"game_id":"..."}}`. Other subscribers receive:

      ```json
      {"event":"game_message","payload":{"game_id":"{{ _.gameplayId }}","from":"8df1c70b-...","message":"hello"}}
      ```

      ## Keepalive

      ```json
      {"event":"ping"}
      ```

      Response: `{"event":"pong","payload":{}}`

      ## Complete error code reference

      | Code | Cause |
      |------|-------|
      | `INVALID_EVENT` | The message has no `event` field |
      | `INVALID_PAYLOAD` | Payload is missing required fields or has wrong types |
      | `NOT_IMPLEMENTED` | The event name is not recognized |
      | `NOT_YOUR_TURN` | Move attempted when it is not your turn |
      | `INVALID_MOVE` | Cell is out of range or already occupied |
      | `GAME_NOT_FOUND` | `game_id` does not exist |
      | `GAME_NOT_ACTIVE` | The game has already ended or is still pending |
      | `NOT_A_PARTICIPANT` | Caller is neither host nor guest |
      | `INVITATION_NOT_PENDING` | Accept/reject called on a game that is not pending |
      | `CANNOT_INVITE_SELF` | `guest_id` equals the host |
      | `OPPONENT_OFFLINE` | Guest is not connected via WebSocket |
      | `UNKNOWN_ERROR` | Any other domain error |

      ## Disconnect behavior

      - Closing the socket while a game is active → the opponent receives `game_ended` with `reason: "abandon"`.
      - Closing the socket removes the user from the online list (presence channel) and cancels all subscriptions.
