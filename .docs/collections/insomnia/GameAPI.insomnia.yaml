  - _id: req_create_gameplay
    parentId: fld_gameplays
    modified: 1790462000000
    created: 1790462000000
    name: Create gameplay
    url: "http://{{ _.baseUrl }}/api/v1/gameplays"
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "currentPositions": "{\"board\": [[0,0,0],[0,0,0],[0,0,0]], \"lastMove\": null}",
          "hostPlayer": "{{ _.userId }}",
          "playerTurn": "{{ _.userId }}",
          "matchResult": null
        }
    parameters: []
    headers:
      - name: Content-Type
        value: application/json
        id: pair_ct_creategp
    description: |-
      # Create gameplay

      Starts a new Tic-Tac-Toe match via REST. The authenticated user becomes the host.

      - **Method**: `POST`
      - **Path**: `/api/v1/gameplays`
      - **Auth**: Required (Bearer JWT)

      > **Note**: this request creates a match via REST. The WebSocket flow uses `create_game` instead, which also handles the invitation handshake.

      ## Request body

      | Field | Type | Required | Notes |
      |-------|------|----------|-------|
      | `currentPositions` | string (JSON-encoded) | Yes | Board state; empty string is allowed |
      | `hostPlayer` | UUID string | Yes | Must equal the JWT `sub` |
      | `guestPlayer` | UUID string \| null | No | Must reference an existing user |
      | `playerTurn` | UUID string | Yes | User whose turn it is |
      | `matchResult` | string (JSON-encoded) \| null | No | Final result, if any |

      ### Example — open match

      ```json
      {
        "currentPositions": "{\"board\": [[0,0,0],[0,0,0],[0,0,0]], \"lastMove\": null}",
        "hostPlayer": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
        "playerTurn": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
        "matchResult": null
      }
      ```

      ## Response — `201 Created`

      ```json
      {
        "id": "cd820ba6-b121-4d64-827e-3b2b4fb7b42b",
        "currentPositions": "{\"board\": [[0,0,0],[0,0,0],[0,0,0]], \"lastMove\": null}",
        "hostPlayer": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f",
