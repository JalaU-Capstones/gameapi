    description: |-
      # 02 — Create Game

      Creates a new game and invites the guest. The guest must already be connected to the gameplays WebSocket (see **01 — Connect + Auth**).

      ## Send (from the host socket)

      ```json
      {"event": "create_game", "payload": {"guest_id": "{{ _.guestId }}"}}
      ```

      ## Expected responses

      **To the host:**

      ```json
      {"event": "game_created", "payload": {"game_id": "...", "guest_id": "...", "board": [[0,0,0],[0,0,0],[0,0,0]], "turn": "<host_uuid>"}}
      ```

      **To the guest:**

      ```json
      {"event": "invitation_received", "payload": {"game_id": "...", "host": {"id": "<host_uuid>", "name": "..."}}}
      ```

      ## Notes

      - Requires both sockets to be authenticated.
      - After receiving `game_created`, copy the `game_id` into `{{ _.gameId }}` in the environment to reuse it in the following steps.
      - The host always plays first (`turn` equals the host's UUID).
