- _id: wrk_gameapi
  parentId: null
  modified: 1790553600000
  created: 1790553600000
  name: Game API
  description: "# Game API\n\nREST API for managing users and Tic-Tac-Toe gameplays,\
    \ with WebSocket support for real-time play.\n\n## Base URL\n\nAll requests use\
    \ the `baseUrl` environment variable, which defaults to `localhost:8080`.\n\n\
    - **REST**: `http://{{ _.baseUrl }}/api/v1/*` and `/api/v2/*`\n- **WebSocket**:\
    \ `ws://{{ _.baseUrl }}/api/v2/ws/*`\n\n## Authentication\n\nAuthenticated REST\
    \ endpoints accept **JWT Bearer tokens**. The v2 auth endpoints also support browser\
    \ sessions with HttpOnly access and refresh cookies. The v2 login returns the\
    \ access token in JSON for CLI compatibility; it never returns the refresh token\
    \ in JSON.\n\n1. Run **Auth (v2) \u2192 Register** to create an account and receive\
    \ an access token, or run **Auth (v2) \u2192 Login (v2)** for an existing account.\n\
    2. Authenticated v2 requests use the `access_token` environment variable; v1 compatibility\
    \ requests use the `token` variable from **Users (v1) \u2192 Login**.\n3. The\
    \ v2 auth endpoints set HttpOnly cookies for browser sessions. Insomnia stores\
    \ the cookies automatically.\n\nWebSocket connections authenticate via a **JSON\
    \ message** sent immediately after the socket opens:\n\n```json\n{\"event\":\"\
    auth\",\"payload\":{\"token\":\"{{ _.token }}\"}}\n```\n\n## Recommended first-time\
    \ flow\n\n1. **Auth (v2) \u2192 Register** \u2014 creates the host account and\
    \ stores `userId` and `access_token`.\n2. **Auth (v2) \u2192 Login (v2)** \u2014\
    \ obtains a fresh v2 access token for an existing account.\n3. **Users (v1) \u2192\
    \ Register user** \u2014 optionally creates a guest account; duplicate it and\
    \ use the guest credentials.\n4. **Users (v1) \u2192 Login** \u2014 optionally\
    \ stores a legacy `token`; duplicate it for the guest and save that token as `guestToken`\
    \ for the WebSocket examples.\n5. **WebSocket (v2) \u2192 Gameplays WS** \u2014\
    \ open two sockets (host + guest), authenticate both, and follow the match flow\
    \ documented inside.\n6. **WebSocket (v2) \u2192 Presence WS** \u2014 connect\
    \ and send the auth message to inspect online users.\n\n## Environment variables\n\
    \n| Variable | Description | Set by |\n|----------|-------------|--------|\n|\
    \ `baseUrl` | Host and port (no scheme) | User |\n| `token` | JWT for the primary\
    \ (host) user | Login script |\n| `userId` | UUID of the primary user | Register\
    \ / Login script |\n| `gameplayId` | Gameplay UUID (REST or WS) | Create gameplay\
    \ script / user |\n| `guestId` | UUID of the guest user | Register guest |\n|\
    \ `guestEmail` | Email of the guest user | User |\n| `guestPassword` | Password\
    \ of the guest user | User |\n| `guestToken` | JWT for the guest user | Login\
    \ as guest |\n| `testEmail` | Email used for the primary login | User |\n| `testPassword`\
    \ | Password used for the primary login | User |\n| `access_token` | Access token\
    \ returned by v2 register/login | Auth (v2) script |\n| `refresh_token` | Refresh\
    \ token captured from the v2 login cookie | Login (v2) script |\n\n## Response\
    \ format\n\nAll errors return a JSON body with a `message` field:\n\n```json\n\
    {\"message\": \"Email is currently registered\"}\n```\n\n## Versioning\n\n- `/api/v1/*`\
    \ \u2014 frozen contract, backward compatible.\n- `/api/v2/*` \u2014 active version,\
    \ used for REST v2, logs, and WebSocket endpoints."
  scope: collection
  _type: workspace
