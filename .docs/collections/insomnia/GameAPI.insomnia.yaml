  - _id: wrk_gameapi
    parentId: null
    modified: 1790462000000
    created: 1790462000000
    name: Game API
    description: |-
      # Game API

      REST API for managing users and Tic-Tac-Toe gameplays, with WebSocket support for real-time play.

      ## Base URL

      All requests use the `baseUrl` environment variable, which defaults to `localhost:8080`.

      - **REST**: `http://{{ _.baseUrl }}/api/v1/*`
      - **WebSocket**: `ws://{{ _.baseUrl }}/api/v2/ws/*`

      ## Authentication

      The API uses **JWT Bearer tokens** for authenticated endpoints.

      1. Run **Users → Register user** to create an account.
      2. Run **Users → Login** to obtain a JWT. The response is stored automatically in the `token` environment variable.
      3. Authenticated requests inject the token via the `Authorization: Bearer <token>` header.

      WebSocket connections authenticate via a **JSON message** sent immediately after the socket opens:

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      ## Recommended first-time flow

      1. **Users → Register user** — creates the host account and stores `userId`.
      2. **Users → Login** — stores `token` and `userId`.
      3. (Optional) Register + Login a **second user** for the guest role. The environment provides `guestEmail`, `guestPassword`, `guestId` and `guestToken` for this purpose.
      4. **Gameplays → Create gameplay** — stores `gameplayId` (REST contract).
      5. **WebSocket (v2) → Presence WS** — connect and send the auth message.
      6. **Game Flow (v2 WS)** — walk through the entire match flow (auth → create → accept → play → end).

      ## Environment variables

      | Variable | Description | Set by |
      |----------|-------------|--------|
      | `baseUrl` | Host and port (no scheme) | User |
      | `token` | JWT for the primary (host) user | Login script |
      | `userId` | UUID of the primary user | Register / Login script |
      | `gameplayId` | Last created gameplay UUID (REST) | Create gameplay script |
      | `gameId` | Gameplay UUID used by the WebSocket flow | User / Create Game response |
      | `guestId` | UUID of the guest user | User |
      | `guestEmail` | Email of the guest user | User |
      | `guestPassword` | Password of the guest user | User |
      | `guestToken` | JWT for the guest user | User (after guest login) |
      | `testEmail` | Email used for the primary login | User |
      | `testPassword` | Password used for the primary login | User |

      ## Response format

      All errors return a JSON body with a `message` field:

      ```json
      {"message": "Email is currently registered"}
      ```

      ## Versioning

      - `/api/v1/*` — frozen contract, backward compatible.
      - `/api/v2/*` — active version, used for REST v2 and WebSocket endpoints.
    scope: collection
    _type: workspace

