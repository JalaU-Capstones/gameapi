      text: ""
    parameters: []
    headers: []
    description: |-
      # Refresh token

      Rotates the current refresh token and issues a new access token.

      - **Method**: `POST`
      - **Path**: `/api/v2/auth/refresh`
      - **Auth**: Uses the `gameapi_rt` cookie (or the browser's cookie jar).

      ## Response — `200 OK`

      ```json
      {"access_token":"...","token_type":"bearer"}
      ```

      The refresh cookie is rotated; the previous value becomes invalid.

      ## Errors

      | Status | Cause |
      |--------|-------|
      | `401` | Refresh cookie is missing, invalid, revoked, or expired |

      Can be chained directly after the previous login: Insomnia's cookie jar stores the refresh cookie and resends it automatically.
    authentication: {}
