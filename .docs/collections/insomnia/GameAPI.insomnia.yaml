    name: Presence WS
    url: "ws://{{ _.baseUrl }}/api/v2/ws/presence"
    headers: []
    authentication: {}
    description: |-
      # Presence WebSocket

      Tracks which users are currently online and broadcasts presence changes.

      - **URL**: `ws://{{ _.baseUrl }}/api/v2/ws/presence`
      - **Auth**: JWT sent as the first message

      ## Step-by-step flow

      ### 1. Connect

      Click **Connect**. Status turns green.

      ### 2. Authenticate

      Send immediately:

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      Success:

      ```json
      {"event":"auth_ok","payload":{"user_id":"8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f"}}
      ```

      ### 3. Keep the connection alive

      ```json
      {"event":"ping"}
      ```

      Response:

      ```json
      {"event":"pong"}
      ```

      ### 4. List online users

      ```json
      {"event":"list_online_users"}
      ```

      Response (shape may vary by server version):

      ```json
      {
        "event": "online_users",
        "payload": {
          "users": [
            {"user_id": "8df1c70b-e4e4-4dc6-80fb-2ce6404ee28f"},
            {"user_id": "9a02d81c-f5f5-4ed7-91fc-3df7515ff39e"}
          ]
        }
      }
      ```

      ### 5. Disconnect

      Click **Disconnect**. The server broadcasts your departure to remaining clients.

      ## Presence events

      When other users connect or disconnect, the server pushes events to all authenticated sockets:

      | Event | Payload | Meaning |
      |-------|---------|---------|
      | `user_online` | `{"user_id": "..."}` | A user just authenticated |
      | `user_offline` | `{"user_id": "..."}` | A user disconnected |

      ## Testing multi-user presence

      1. Connect with the host user (`{{ _.token }}`), authenticate.
      2. Duplicate this request (`Ctrl+D`), connect with the guest user (`{{ _.guestToken }}`), authenticate.
      3. In either socket, send `list_online_users`. Both users should appear.
      4. Disconnect the guest socket (`Ctrl+C`). The host socket should receive a `user_offline` event with the guest's UUID.

      ## Error events

      | Event | Reason | Cause |
      |-------|--------|-------|
      | `auth_error` | `invalid_token` | Token malformed, expired, or wrong signature |
      | `auth_timeout` (close) | — | `auth` not sent within the timeout window |
      | `error` | `unknown_event` | Event name not recognized |
