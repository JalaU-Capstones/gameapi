      Rejects a pending invitation. Send this from the **guest socket** while the invitation is still pending.

      ## Send

      ```json
      {"event": "reject_invitation", "payload": {"game_id": "{{ _.gameId }}"}}
      ```

      ## Expected response (to the host)

      ```json
      {"event": "invitation_rejected", "payload": {"game_id": "{{ _.gameId }}", "guest_id": "{{ _.guestId }}"}}
      ```

