  - _id: wrk_gameapi
    parentId: null
    modified: 1790553600000
    created: 1790553600000
    name: Game API
    description: |-
      # Game API

      REST API for managing users and Tic-Tac-Toe gameplays, with WebSocket support for real-time play.

      ## Base URL

      All requests use the `baseUrl` environment variable, which defaults to `localhost:8080`.

      - **REST**: `http://{{ _.baseUrl }}/api/v1/*` and `/api/v2/*`
      - **WebSocket**: `ws://{{ _.baseUrl }}/api/v2/ws/*`

      ## Authentication

      Authenticated REST endpoints accept **JWT Bearer tokens**. The v2 auth endpoints also support browser sessions with HttpOnly access and refresh cookies. The v2 login returns the access token in JSON for CLI compatibility; it never returns the refresh token in JSON.

      1. Run **Users → Register user** to create an account.
      2. Run **Users → Login** to obtain a JWT. The response is stored automatically in the `token` environment variable.
      3. Authenticated requests inject the token via the `Authorization: Bearer <token>` header.
      4. For cookie-based browser auth, run **Auth (v2) → Login (v2)**. Insomnia stores the HttpOnly cookies and the request script stores `access_token`.

      WebSocket connections authenticate via a **JSON message** sent immediately after the socket opens:

      ```json
      {"event":"auth","payload":{"token":"{{ _.token }}"}}
      ```

      ## Recommended first-time flow

      1. **Users → Register user** — creates the host account and stores `userId`.
      2. **Users → Login** — stores `token` and `userId`.
      3. **Users → Register guest** — creates the guest account and stores `guestId`. *(Duplicate the Register user request and point the email/password at the guest values.)*
      4. **Users → Login as guest** — stores `guestToken`. *(Duplicate the Login request and use the guest credentials.)*
      5. **WebSocket (v2) → Gameplays WS** — open two sockets (host + guest), authenticate both, and follow the match flow documented inside.
      6. **WebSocket (v2) → Presence WS** — connect and send the auth message to inspect online users.

      ## Environment variables

      | Variable | Description | Set by |
      |----------|-------------|--------|
      | `baseUrl` | Host and port (no scheme) | User |
      | `token` | JWT for the primary (host) user | Login script |
      | `userId` | UUID of the primary user | Register / Login script |
      | `gameplayId` | Gameplay UUID (REST or WS) | Create gameplay script / user |
      | `guestId` | UUID of the guest user | Register guest |
      | `guestEmail` | Email of the guest user | User |
      | `guestPassword` | Password of the guest user | User |
      | `guestToken` | JWT for the guest user | Login as guest |
      | `testEmail` | Email used for the primary login | User |
      | `testPassword` | Password used for the primary login | User |
      | `access_token` | Access token returned by v2 login | Login (v2) script |
      | `refresh_token` | Refresh token captured from the v2 login cookie | Login (v2) script |

      ## Response format

      All errors return a JSON body with a `message` field:

      ```json
      {"message": "Email is currently registered"}
      ```

      ## Versioning

      - `/api/v1/*` — frozen contract, backward compatible.
      - `/api/v2/*` — active version, used for REST v2, logs, and WebSocket endpoints.
    scope: collection
    _type: workspace

