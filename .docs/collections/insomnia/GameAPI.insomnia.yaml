- _id: fld_auth_v2
  parentId: wrk_gameapi
  modified: 1790553600000
  created: 1790553600000
  name: Auth (v2)
  description: "# Auth (v2)\n\nAuthentication endpoints for browsers, frontends, and\
    \ clients using HttpOnly cookies.\n\n- `POST /api/v2/auth/login` \u2014 validates\
    \ credentials, sets the `gameapi_at` and `gameapi_rt` cookies, and returns the\
    \ access token in the body without exposing the refresh token.\n- `POST /api/v2/auth/refresh`\
    \ \u2014 rotates the refresh token and issues a new access token.\n- `POST /api/v2/auth/logout`\
    \ \u2014 revokes the refresh token and clears both cookies.\n- `GET /api/v2/auth/me`\
    \ \u2014 returns the current user using either the cookie or the Authorization\
    \ header.\n- `POST /api/v2/auth/session/takeover` \u2014 revokes other active\
    \ sessions and closes their WebSockets with code `4409` (`session_replaced`)."
  environment: {}
  environmentPropertyOrder: null
  metaSortKey: -1790553600001
  _type: request_group
- _id: fld_users
  parentId: wrk_gameapi
  modified: 1790553600000
  created: 1790553600000
  name: Users (v1)
  description: '# Users (v1)


    Legacy user account management. The v1 contract is kept for compatibility, but
    reads are now protected by JWT and the active auth flow is centered on `/api/v2/auth/*`.


    ## Endpoints


    | Method | Path | Auth | Description |

    |--------|------|------|-------------|

    | `POST` | `/api/v1/users` | No | Register a new user |

    | `GET` | `/api/v1/users` | Yes | List all users |

    | `GET` | `/api/v1/users/{id}` | Yes | Get one user by UUID |

    | `PUT` | `/api/v1/users/{id}` | Yes | Update your own account |

    | `DELETE` | `/api/v1/users/{id}` | Yes | Delete your own account |

    | `POST` | `/api/v1/users/login` | No | Login and obtain a JWT |


    ## Authentication


    Authenticated reads and writes require a valid JWT. This is the compatibility
    contract; new clients should prefer `/api/v2/auth` plus the dedicated v2 resource
    endpoints.


    ## Typical error responses


    | Status | Reason |

    |--------|--------|

    | `400` | Invalid email format, password too short, missing fields |

    | `401` | Missing or invalid token |

    | `403` | Trying to modify another user |

    | `404` | User not found |

    | `409` | Email already registered |'
  environment: {}
  environmentPropertyOrder: null
  metaSortKey: -1790553600000
  _type: request_group
- _id: fld_gameplays
  parentId: wrk_gameapi
  modified: 1790553600000
  created: 1790553600000
  name: Gameplays (v1)
  description: '# Gameplays (v1)


    Legacy REST gameplay contract kept for compatibility. Auth is required for reads
    and writes. The active realtime workflow should be driven through `/api/v2/ws/gameplays`.


    ## Endpoints


    | Method | Path | Auth | Description |

    |--------|------|------|-------------|

    | `GET` | `/api/v1/gameplays` | Yes | List all gameplays |

    | `GET` | `/api/v1/gameplays/my-gameplays` | Yes | List your gameplays |

    | `GET` | `/api/v1/gameplays/player/{id}` | Yes | List gameplays for a player
    |

    | `GET` | `/api/v1/gameplays/{id}` | Yes | Get one gameplay by UUID |

    | `POST` | `/api/v1/gameplays` | Yes | Create a gameplay |

    | `PUT` | `/api/v1/gameplays/{id}` | Yes | Update (participants only) |

    | `DELETE` | `/api/v1/gameplays/{id}` | Yes | Delete (host only) |


    ## Authentication and permissions


    - **Create**: only the authenticated user can be the host.

    - **Update**: only the host or guest can update.

    - **Delete**: only the host can delete.

    - **Read**: all gameplay reads now require a valid JWT.


    ## Typical error responses


    | Status | Reason |

    |--------|--------|

    | `400` | Invalid input |

    | `401` | Missing or invalid token |

    | `403` | Not the owner / not a participant |

    | `404` | Gameplay not found |'
  environment: {}
  environmentPropertyOrder: null
  metaSortKey: -1790553600000
  _type: request_group
