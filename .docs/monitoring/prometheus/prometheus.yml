# Prometheus configuration for the local observability stack.
#
# The API and exporter jobs scrape the local monitoring stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: gameapi

scrape_configs:
  # ---------------------------------------------------------------------------
  # API metrics. Served by FastAPI when METRICS_ENABLED=true.
  # ---------------------------------------------------------------------------
  - job_name: gameapi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # ---------------------------------------------------------------------------
  # cAdvisor: container-level metrics.
  # ---------------------------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # ---------------------------------------------------------------------------
  # postgres-exporter: database metrics.
  # ---------------------------------------------------------------------------
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # ---------------------------------------------------------------------------
  # blackbox-exporter: external probe of the API health endpoint.
  # ---------------------------------------------------------------------------
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8080/health"]
        labels:
          service: blackbox
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
