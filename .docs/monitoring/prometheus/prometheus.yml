# Prometheus configuration for the local observability stack.
#
# The API job is the only active scrape target in this prompt. The three
# exporter jobs below are commented out because those services are added in a
# later step. Do not uncomment them until the corresponding containers exist,
# otherwise Prometheus will log "no such host" errors on every scrape cycle.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: gameapi

scrape_configs:
  # ---------------------------------------------------------------------------
  # API metrics. Served by FastAPI when METRICS_ENABLED=true.
  # ---------------------------------------------------------------------------
  - job_name: gameapi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

